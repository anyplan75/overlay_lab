<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 자막 방송 송출 화면 (Admin)</title>
    <!-- 꾸밈 문서 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<!-- 배경을 투명하게 만들어주는 admin-body 클래스 적용 -->
<body class="admin-body">

    <!-- 자막이 실시간으로 담기는 상자 -->
    <div id="subtitleContainer"></div>

    <script>
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        const container = document.getElementById('subtitleContainer');

        let lastTimestamp = 0;

        // 파이어베이스 데이터 수신
        async function fetchSubtitles() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();

                if (data && data._timestamp > lastTimestamp) {
                    lastTimestamp = data._timestamp;
                    updateScreen(data);
                }
            } catch (error) {
                console.log("데이터 수신 오류:", error);
            }
        }

        // 언어별로 화면에 그려주기 (CSS의 [lang="ko"] 등과 연결됨)
        function updateScreen(data) {
            container.innerHTML = "";

            // 송출할 언어 목록 (원하는 순서대로 화면에 쌓입니다)
            const targetLangs = ['ko', 'en', 'zh-CN', 'vi', 'ru'];
            
            targetLangs.forEach(lang => {
                if (data[lang] && data[lang].text) {
                    const langBox = document.createElement('div');
                    langBox.className = "subtitle-text";
                    // 언어 속성을 부여하여 style.css가 인식하게 만듭니다.
                    langBox.setAttribute("lang", lang);
                    
                    // 자막 내용 삽입
                    const textSpan = document.createElement('span');
                    textSpan.innerHTML = data[lang].text;
                    langBox.appendChild(textSpan);
                    
                    container.appendChild(langBox);
                }
            });
        }

        // 0.5초(500밀리초)마다 변경 사항을 확인합니다
        setInterval(fetchSubtitles, 500);

    </script>
</body>
</html>
