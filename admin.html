<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 자막 제어판 (Admin)</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 30px; }
        h1 { color: #f1c40f; }
        .card { background: #34495e; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
        .global-settings { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-top: 15px; }
        .global-settings select { padding: 8px; font-size: 16px; border-radius: 5px; font-weight: bold; }
        .lang-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #455a64; }
        .lang-label { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 180px; }
        input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; }
        .input-group { display: flex; gap: 15px; align-items: center; font-size: 16px; }
        input[type="number"] { width: 70px; padding: 6px; font-size: 16px; text-align: center; border-radius: 5px; border: none; font-weight: bold; }
        .btn { padding: 20px 30px; font-size: 22px; font-weight: bold; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>⚙️ 예배 자막 송출 설정 (어드민)</h1>
    
    <!-- 💡 형님이 원래 설정하셨던 직관적인 위/아래/왼쪽/오른쪽 화면 배치 복원 -->
    <div class="card">
        <h2 style="margin: 0 0 10px 0; color: #3498db;">🖥️ 전체 화면 배치 및 정렬</h2>
        <div class="global-settings">
            <label>자막 화면 배치:
                <select id="global_layout">
                    <option value="bottom" selected>아래 (하단 전체)</option>
                    <option value="top">위 (상단 전체)</option>
                    <option value="left">왼쪽 (우측은 목사님 화면)</option>
                    <option value="right">오른쪽 (좌측은 목사님 화면)</option>
                </select>
            </label>
            <label>글자 정렬:
                <select id="global_align">
                    <option value="left">좌측 정렬</option>
                    <option value="center" selected>중앙 정렬</option>
                    <option value="right">우측 정렬</option>
                </select>
            </label>
        </div>
    </div>

    <!-- 각 언어별 켜기/끄기 및 글자 속성 제어 -->
    <div class="card" id="controls">
        <h2 style="margin: 0 0 10px 0; color: #e74c3c;">🌍 개별 언어 설정</h2>
    </div>
    
    <button class="btn" onclick="applySettings()">💾 설정 즉시 적용하기</button>
    <p id="msg" style="color: #2ecc71; font-weight: bold; text-align: center; margin-top: 20px; font-size: 20px;"></p>

    <script>
        const SETTINGS_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/settings.json";
        
        const languages = [
            { code: 'ko', name: '한국어', defaultSize: 42, defaultSpacing: -1 },
            { code: 'en', name: '영어', defaultSize: 32, defaultSpacing: 1 },
            { code: 'zh-CN', name: '중국어', defaultSize: 38, defaultSpacing: 1 },
            { code: 'vi', name: '베트남어', defaultSize: 32, defaultSpacing: 0 },
            { code: 'id', name: '인도네시아어', defaultSize: 30, defaultSpacing: 0 },
            { code: 'ne', name: '네팔어', defaultSize: 30, defaultSpacing: 0 },
            { code: 'tl', name: '타갈로그어', defaultSize: 30, defaultSpacing: 0 },
            { code: 'ru', name: '러시아어', defaultSize: 30, defaultSpacing: 0 }
        ];

        const controlsDiv = document.getElementById('controls');

        languages.forEach(lang => {
            controlsDiv.innerHTML += `
                <div class="lang-row">
                    <label class="lang-label">
                        <input type="checkbox" id="check_${lang.code}" checked>
                        ${lang.name}
                    </label>
                    <div class="input-group">
                        <div>크기: <input type="number" id="size_${lang.code}" value="${lang.defaultSize}"> px</div>
                        <div>자간: <input type="number" id="spacing_${lang.code}" value="${lang.defaultSpacing}" step="0.5"> px</div>
                    </div>
                </div>
            `;
        });

        async function loadSettings() {
            try {
                const res = await fetch(SETTINGS_URL);
                const data = await res.json();
                if (data) {
                    if (data.global) {
                        document.getElementById('global_layout').value = data.global.layout || 'bottom';
                        document.getElementById('global_align').value = data.global.align || 'center';
                    }
                    languages.forEach(lang => {
                        if (data[lang.code]) {
                            document.getElementById(`check_${lang.code}`).checked = data[lang.code].show;
                            document.getElementById(`size_${lang.code}`).value = data[lang.code].fontSize || lang.defaultSize;
                            document.getElementById(`spacing_${lang.code}`).value = data[lang.code].letterSpacing || lang.defaultSpacing;
                        }
                    });
                }
            } catch (e) {}
        }

        async function applySettings() {
            let currentSettings = {
                _timestamp: Date.now(),
                global: {
                    layout: document.getElementById('global_layout').value,
                    align: document.getElementById('global_align').value
                }
            };
            
            languages.forEach(lang => {
                currentSettings[lang.code] = {
                    show: document.getElementById(`check_${lang.code}`).checked,
                    fontSize: parseFloat(document.getElementById(`size_${lang.code}`).value),
                    letterSpacing: parseFloat(document.getElementById(`spacing_${lang.code}`).value)
                };
            });

            try {
                await fetch(SETTINGS_URL, { method: "PUT", body: JSON.stringify(currentSettings) });
                const msgBox = document.getElementById('msg');
                msgBox.innerText = "✅ 설정이 실시간 화면에 반영되었습니다.";
                setTimeout(() => msgBox.innerText = "", 3000);
            } catch (e) { alert("설정 전송 실패"); }
        }

        loadSettings();
    </script>
</body>
</html>
