<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 자막 제어판 (Admin)</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 30px; }
        h1 { color: #f1c40f; }
        .card {
            background: #34495e;
            padding: 15px 25px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card label {
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="checkbox"] { width: 30px; height: 30px; cursor: pointer; }
        input[type="number"] {
            width: 90px;
            padding: 8px;
            font-size: 20px;
            text-align: center;
            border-radius: 5px;
            border: none;
            font-weight: bold;
        }
        .btn {
            padding: 20px 30px;
            font-size: 22px;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background: #2ecc71; }
    </style>
</head>
<body>
    <h1>⚙️ 예배 자막 송출 설정 (어드민)</h1>
    <p style="font-size: 18px; color: #bdc3c7; margin-bottom: 30px;">
        체크박스를 끄면 해당 언어는 즉시 송출 화면에서 사라집니다. 글자 크기도 나라별로 조절해 보세요.
    </p>

    <div id="controls"></div>
    
    <button class="btn" onclick="applySettings()">💾 이 설정으로 실시간 화면 변경하기</button>
    <p id="msg" style="color: #2ecc71; font-weight: bold; text-align: center; margin-top: 20px; font-size: 20px;"></p>

    <script>
        // 형님의 파이어베이스 주소 아래에 settings.json 이라는 설정 전용 공간을 만듭니다.
        const SETTINGS_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/settings.json";
        
        // 형님이 쓰시는 8개 국어 목록과 기본 글자 크기
        const languages = [
            { code: 'ko', name: '한국어', defaultSize: 42 },
            { code: 'en', name: '영어', defaultSize: 32 },
            { code: 'zh-CN', name: '중국어', defaultSize: 38 },
            { code: 'vi', name: '베트남어', defaultSize: 32 },
            { code: 'id', name: '인도네시아어', defaultSize: 30 },
            { code: 'ne', name: '네팔어', defaultSize: 30 },
            { code: 'tl', name: '타갈로그어', defaultSize: 30 },
            { code: 'ru', name: '러시아어', defaultSize: 30 }
        ];

        const controlsDiv = document.getElementById('controls');

        // 1. 제어판 화면(UI) 그려주기
        languages.forEach(lang => {
            controlsDiv.innerHTML += `
                <div class="card">
                    <label>
                        <input type="checkbox" id="check_${lang.code}" checked>
                        ${lang.name} 켜기
                    </label>
                    <div>
                        글자 크기: <input type="number" id="size_${lang.code}" value="${lang.defaultSize}"> px
                    </div>
                </div>
            `;
        });

        // 2. 파이어베이스에서 마지막에 저장했던 설정 불러오기
        async function loadSettings() {
            try {
                const res = await fetch(SETTINGS_URL);
                const data = await res.json();
                if (data) {
                    languages.forEach(lang => {
                        if (data[lang.code]) {
                            document.getElementById(`check_${lang.code}`).checked = data[lang.code].show;
                            document.getElementById(`size_${lang.code}`).value = data[lang.code].fontSize;
                        }
                    });
                }
            } catch (e) { console.log("기존 설정을 불러오지 못했습니다."); }
        }

        // 3. 버튼을 누르면 파이어베이스로 설정값 쏘기
        async function applySettings() {
            let currentSettings = { _timestamp: Date.now() };
            
            languages.forEach(lang => {
                currentSettings[lang.code] = {
                    show: document.getElementById(`check_${lang.code}`).checked,
                    fontSize: parseInt(document.getElementById(`size_${lang.code}`).value)
                };
            });

            try {
                await fetch(SETTINGS_URL, {
                    method: "PUT",
                    body: JSON.stringify(currentSettings)
                });
                const msgBox = document.getElementById('msg');
                msgBox.innerText = "✅ 설정이 파이어베이스로 전송되었습니다! 화면이 즉시 바뀝니다.";
                setTimeout(() => msgBox.innerText = "", 3500);
            } catch (e) {
                alert("설정 전송에 실패했습니다. 인터넷을 확인해 주세요.");
            }
        }

        // 창을 열자마자 기존 설정 불러오기 실행
        loadSettings();
    </script>
</body>
</html>
