<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>방송 자막 디자인 제어판</title></head>
<body>
    <h2>방송 자막 실시간 제어판</h2>
    
    <label><b>자막 나타날 위치:</b> <br>
        <select id="layoutStyle" style="padding:5px; font-size:16px; margin-bottom:10px;">
            <option value="bottom">화면 하단 중앙 (기본)</option>
            <option value="top">화면 상단 중앙</option>
            <option value="left">화면 왼쪽 2/5 (세로 누적)</option>
            <option value="right">화면 오른쪽 2/5 (세로 누적)</option>
        </select>
    </label><br>

    <label><b>글자 정렬 방식:</b> <br>
        <select id="textAlign" style="padding:5px; font-size:16px;">
            <option value="left">왼쪽 정렬 (추천)</option>
            <option value="center">가운데 정렬</option>
            <option value="right">오른쪽 정렬</option>
        </select>
    </label><br><br><hr><br>

    <label>글자 크기: <input type="range" id="fontSize" min="20" max="150" value="40"></label><br><br>
    <label>글자 색상: <input type="color" id="color" value="#ffffff"></label><br><br>
    <label>배경 색상: <input type="color" id="bgColor" value="#000000"></label><br><br>
    <label>배경 투명도: <input type="range" id="bgOpacity" min="0" max="1" step="0.1" value="0.7"></label><br><br>
    
    <button onclick="saveStyle()" style="padding:10px 20px; font-size:18px; cursor:pointer;">스타일 방송으로 전송</button>

    <script>
        function saveStyle() {
            const styleData = {
                layout: document.getElementById('layoutStyle').value,
                align: document.getElementById('textAlign').value,
                fontSize: document.getElementById('fontSize').value + 'px',
                color: document.getElementById('color').value,
                bgColor: document.getElementById('bgColor').value,
                bgOpacity: document.getElementById('bgOpacity').value
            };
            fetch("https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/style.json", {
                method: "PUT", body: JSON.stringify(styleData)
            }).then(() => alert("방송 화면에 즉시 적용되었습니다."));
        }
    </script>
</body>
</html>
