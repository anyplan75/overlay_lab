<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한국어 자막</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container" class="layout-bottom">
        <div id="subtitle">한국어 자막 대기 중...</div>
    </div>
    <script>
        const currentLang = 'ko';
        let lastTime = 0, subtitleLines = [], maxLines = 2;
        
        function updateSubtitle() {
            fetch("https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/.json")
            .then(r => r.json())
            .then(d => {
                const c = document.getElementById('container');
                const s = document.getElementById('subtitle');
                
                if (d && d.style && d.style.layout) {
                    c.className = d.style.layout === 'left' ? 'layout-left' : 'layout-bottom';
                    maxLines = d.style.layout === 'left' ? 10 : 2;
                }
                
                if (d && d.subtitles && d.subtitles._timestamp !== lastTime) {
                    lastTime = d.subtitles._timestamp;
                    let n = d.subtitles[currentLang];
                    if (n) {
                        subtitleLines.push(n);
                        while (subtitleLines.length > maxLines) {
                            subtitleLines.shift();
                        }
                        // 줄바꿈 하나로 촘촘하게 묶습니다.
                        s.innerHTML = subtitleLines.join('<br>');
                    }
                }
                
                if (d && d.style) {
                    s.style.fontSize = d.style.fontSize;
                    s.style.color = d.style.color;
                    let h = d.style.bgColor.replace('#', '');
                    let r = parseInt(h.substring(0,2), 16), g = parseInt(h.substring(2,4), 16), b = parseInt(h.substring(4,6), 16);
                    s.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${d.style.bgOpacity})`;
                }
            });
        }
        setInterval(updateSubtitle, 300);
    </script>
</body>
</html>
