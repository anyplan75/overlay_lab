<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 예배 송출기 (무지연 초고속)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        h1 { color: #4CAF50; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; }
        #startBtn { background-color: #f44336; color: white; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 300px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.6; }
        .ko-text { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ 예배 실시간 번역 송출기</h1>
    <p>파이썬 없이 크롬 브라우저의 초고속 엔진으로 파이어베이스에 직접 쏩니다.</p>
    
    <button id="startBtn" onclick="startBroadcast()">🔴 방송 시작 (마이크 켜기)</button>
    <button id="stopBtn" onclick="stopBroadcast()">⏹️ 방송 종료 및 요약 저장</button>

    <div id="logBox">대기 중... 방송 시작 버튼을 눌러주세요.</div>

    <script>
        // 👉 여기에 형님의 제미나이 API 키를 넣어주세요.
        const GEMINI_API_KEY = "AIzaSyAHkYcv8tZ-NaRH2NBmLdVGQ-PjOOqwsiM";
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;
        let fullSermonText = ""; // 설교 종료 후 요약할 전체 텍스트 누적 바구니

        // 1. 크롬 웹 음성 인식 엔진 세팅
        if (!('webkitSpeechRecognition' in window)) {
            alert("이 기능은 구글 크롬(Chrome) 브라우저에서만 작동합니다!");
        } else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true; // 끊기지 않고 계속 듣기
            recognition.interimResults = false; // 문장이 완성되었을 때만 처리(번역 품질 확보)
            recognition.lang = 'ko-KR';

            recognition.onresult = async function(event) {
                let finalSentence = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalSentence += event.results[i][0].transcript.trim();
                    }
                }

                if (finalSentence) {
                    fullSermonText += finalSentence + " ";
                    logMessage(`🇰🇷 한국어 인식됨: ${finalSentence}`);
                    
                    // 한국어가 완성되자마자 7개국어로 즉시 번역
                    const targetLangs = ['en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'];
                    let payload = { ko: finalSentence, _timestamp: Date.now() };

                    // 병렬 초고속 번역 처리
                    await Promise.all(targetLangs.map(async (lang) => {
                        payload[lang] = await fetchTranslation(finalSentence, lang);
                    }));

                    // 파이어베이스로 쏘기 (기존 8개 화면이 이걸 받아서 띄웁니다)
                    fetch(FIREBASE_URL, {
                        method: "PUT",
                        body: JSON.stringify(payload)
                    }).catch(e => console.error("파이어베이스 전송 오류:", e));
                }
            };

            // 마이크가 멈추면 자동으로 다시 켜서 무중단 유지
            recognition.onend = function() {
                if (isBroadcasting) recognition.start();
            };
        }

        // 2. 무료 구글 번역기 API 통신 함수
        async function fetchTranslation(text, targetLang) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                return data[0].map(item => item[0]).join("");
            } catch (error) {
                return text; // 번역 실패 시 원문 송출
            }
        }

        // 3. 버튼 동작 제어
        function startBroadcast() {
            isBroadcasting = true;
            fullSermonText = ""; // 텍스트 초기화
            recognition.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            logMessage("🎙️ 무중단 실시간 송출을 시작합니다. (목사님 호흡 단위로 번역됩니다)");
        }

        async function stopBroadcast() {
            isBroadcasting = false;
            recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            logMessage("⏹️ 방송이 종료되었습니다. 제미나이에게 설교 요약을 요청합니다...");

            // 파이어베이스 초기화 (다음 예배를 위해)
            fetch(FIREBASE_URL, { method: "PUT", body: JSON.stringify({ _timestamp: Date.now() }) });

            // 제미나이 요약 및 텍스트 파일 자동 다운로드
            await generateSummaryFile();
        }

        // 4. 제미나이 요약 및 다운로드 기능 (파이썬 기능 완벽 이식)
        async function generateSummaryFile() {
            if (!fullSermonText.trim()) {
                logMessage("⚠️ 녹음된 설교 내용이 없어 요약하지 않습니다.");
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const prompt = `아래 예배 설교를 서론-본론-결론 소제목을 달아 완벽한 요약 문서로 만들어줘.\n\n[설교 원본]\n${fullSermonText}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const result = await response.json();
                
                let finalSummary = "";
                if (result.candidates) {
                    finalSummary = result.candidates[0].content.parts[0].text;
                    logMessage("✅ 제미나이 요약 완료! 파일 다운로드가 시작됩니다.");
                } else {
                    finalSummary = `[API 오류]\n${JSON.stringify(result.error)}\n\n[원본 텍스트]\n${fullSermonText}`;
                    logMessage("⚠️ 요약 실패. 원본 파일로 저장합니다.");
                }

                // 텍스트 파일로 만들어서 컴퓨터에 자동 다운로드
                const blob = new Blob([finalSummary], { type: 'text/plain' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                
                const now = new Date();
                const filename = `설교요약_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}_${now.getHours()}-${now.getMinutes()}.txt`;
                
                link.download = filename;
                link.click();

            } catch (error) {
                logMessage(`❌ 제미나이 통신 오류: ${error}`);
            }
        }

        function logMessage(msg) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div class="ko-text">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
