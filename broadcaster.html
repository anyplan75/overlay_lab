<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 송출기 (마이크 논스톱 + 백그라운드 교정 덮어쓰기)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        h1 { color: #4CAF50; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; }
        #startBtn { background-color: #f44336; color: white; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 15px; border-radius: 8px; font-size: 22px; margin-top: 20px; min-height: 30px; font-weight: bold;}
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 350px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.6; font-size: 14px;}
        .ko-text { color: #4CAF50; }
        .ai-text { color: #00bcd4; font-weight: bold; margin-bottom: 10px;}
        .highlight-fixed { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ 마이크 논스톱 + 백그라운드 교정 덮어쓰기</h1>
    <p>마이크는 끊김 없이 원문을 계속 송출하고, 교정본이 완성되면 기존 문장을 빨간색 강조와 함께 매끄럽게 덮어씁니다.</p>
    
    <button id="startBtn" onclick="startBroadcast()">🔴 방송 시작</button>
    <button id="stopBtn" onclick="stopBroadcast()">⏹️ 방송 종료</button>

    <div id="realtimeText">대기 중...</div>
    <div id="logBox">실시간 처리 기록이 쌓입니다.</div>

    <script>
        const GEMINI_API_KEY = "형님의_API_키를_넣어주세요";
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;

        // 💡 마이크는 절대 건드리지 않고 계속 듣는 원본 구조
        if (!('webkitSpeechRecognition' in window)) alert("구글 크롬 브라우저 전용입니다!");
        else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                let interimTranscript = "";
                let finalTranscript = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                let currentText = finalTranscript || interimTranscript;
                if (currentText.trim()) {
                    let sentenceId = "msg_" + Date.now(); // 고유 ID 부여
                    let rawText = currentText.trim();

                    document.getElementById('realtimeText').innerText = `듣는 중: ${rawText}`;

                    // 1단계: 원문을 즉시 실시간으로 먼저 쏜다! (마이크는 멈추지 않음)
                    sendToFirebase(rawText, sentenceId, false);
                    logMessage(`🎤 원본 송출: ${rawText}`);

                    // 2단계: 백그라운드에서 교정 시작 (완료되면 이 문장을 덮어씀)
                    processBackgroundCorrection(rawText, sentenceId);
                }
            };

            recognition.onerror = function(event) { console.log("마이크 상태: " + event.error); };
            recognition.onend = function() {
                if (isBroadcasting) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        // 💡 백그라운드 교정 및 기존 ID 덮어쓰기 함수
        async function processBackgroundCorrection(text, msgId) {
            let corrected = await correctKoreanWithGemini(text);
            
            // 만약 AI가 실패했거나 똑같다면 자체 규칙으로 보정
            if (!corrected || corrected === text) {
                corrected = text
                    .replace(/하나님 의/g, '하나님<span class="highlight-fixed">의</span>')
                    .replace(/예수 그리스도/g, '예수 그리스도<span class="highlight-fixed">의</span>')
                    .replace(/성령 님/g, '성령<span class="highlight-fixed">님</span>');
            } else {
                // 교정된 핵심 단어 빨간색 표시
                corrected = corrected
                    .replace(/하나님의/g, '하나님<span class="highlight-fixed">의</span>')
                    .replace(/성령님/g, '성령<span class="highlight-fixed">님</span>');
            }

            logMessage(`✨ 교정 완료 덮어쓰기: ${corrected}`, true);

            // 동일한 msgId를 사용하여 파이어베이스의 기존 문장을 교정본으로 덮어씀!
            let cleanCorrected = corrected.replace(/<[^>]*>/g, '');
            sendToFirebase(cleanCorrected, msgId, true, corrected);
        }

        async function correctKoreanWithGemini(text) {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const prompt = `다음 텍스트의 오탈자만 교정해. 결과만 출력:\n${text}`;
                const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) return result.candidates[0].content.parts[0].text.trim();
            } catch (error) {}
            return text;
        }

        // 파이어베이스 전송 (8개국어 번역 포함)
        async function sendToFirebase(text, msgId, isCorrected, displayHtml = "") {
            const targetLangs = ['en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'];
            let translationPayload = { _timestamp: Date.now() };

            await Promise.all(targetLangs.map(async (lang) => {
                let trans = await fetchTranslation(text, lang);
                translationPayload[lang] = { text: trans, id: msgId };
            }));

            translationPayload['ko'] = { text: text, id: msgId };
            
            // 파이어베이스에 패치하여 기존 메시지 ID 업데이트
            fetch(FIREBASE_URL, { method: "PATCH", body: JSON.stringify(translationPayload) }).catch(e => {});
        }

        async function fetchTranslation(text, targetLang) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                return data[0].map(item => item[0]).join("");
            } catch (error) { return text; }
        }

        function startBroadcast() {
            isBroadcasting = true;
            recognition.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            logMessage("🎙️ 마이크 논스톱 송출기 가동 시작!");
        }
        
        function stopBroadcast() {
            isBroadcasting = false;
            if(recognition) recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            logMessage("⏹️ 방송이 종료되었습니다.");
        }

        function logMessage(msg, isAi = false) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div style="margin-bottom: 6px;" class="${isAi ? 'ai-text' : 'ko-text'}">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
