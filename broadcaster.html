<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 자막 송출기 (초단위 즉시 절단 및 최적화)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #1e1e1e; color: white; padding: 20px; margin: 0; user-select: none; }
        h1 { color: #4CAF50; text-align: center; margin-bottom: 10px; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; transition: 0.3s; }
        #folderBtn { background-color: #FF9800; color: white; }
        #startBtn { background-color: #f44336; color: white; display: none; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 15px; border-radius: 8px; font-size: 22px; margin-top: 20px; font-weight: bold; text-align: center; transition: color 0.3s; }
        .key-container { background: #2c3e50; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <h1>🎙️ 실시간 다중 송출 시스템</h1>
    
    <div class="key-container">
        <label for="apiKeyInput" style="font-weight: bold; font-size: 18px; margin-right: 10px;">🔑 OpenAI API 키:</label>
        <input type="password" id="apiKeyInput" placeholder="sk-proj-..." style="padding: 10px; font-size: 16px; width: 300px; border-radius: 5px; border: none;">
        <button class="btn" style="padding: 10px 20px; font-size: 16px; margin: 0 0 0 10px; background: #3498db;" onclick="saveApiKey()">내 PC에 저장</button>
        <p style="font-size: 13px; color: #bdc3c7; margin-top: 10px;">* 한 번만 저장하면 브라우저가 기억합니다. (깃허브 코드에는 절대 올라가지 않아 안전합니다)</p>
    </div>

    <div style="text-align: center;">
        <button id="folderBtn" class="btn" onclick="connectLocalFolder()">📁 저장 폴더 연결하기</button>
        <button id="startBtn" class="btn" onclick="startBroadcast()">🔴 방송 시작</button>
        <button id="stopBtn" class="btn" onclick="stopBroadcast()">⏹️ 방송 종료</button>
    </div>

    <div id="realtimeText">대기 중...</div>
    
    <div id="logBox" style="background: #111; padding: 20px; border-radius: 8px; height: 500px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.8;"></div>

    <script>
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let OPENAI_API_KEY = localStorage.getItem('saved_openai_key') || "";
        document.getElementById('apiKeyInput').value = OPENAI_API_KEY;

        function saveApiKey() {
            const inputKey = document.getElementById('apiKeyInput').value.trim();
            if (inputKey.startsWith("sk-")) {
                OPENAI_API_KEY = inputKey;
                localStorage.setItem('saved_openai_key', OPENAI_API_KEY);
                alert("✅ 키가 브라우저에 안전하게 저장되었습니다! 이제 방송을 시작하셔도 됩니다.");
            } else {
                alert("❌ 올바른 OpenAI API 키 형식이 아닙니다. (sk- 로 시작해야 합니다)");
            }
        }

        let recognition;
        let isBroadcasting = false;
        let folderHandle = null;
        
        // 💡 메모리를 갉아먹는 globalFinalText 변수를 완전 삭제하고, 가벼운 미처리 텍스트만 들고 갑니다.
        let unprocessedFinalText = "";
        let currentSentenceId = Date.now();
        let lastSpeechTime = Date.now();
        let silenceTimer = null;
        let lastLivePushTime = 0;

        async function connectLocalFolder() {
            try {
                folderHandle = await window.showDirectoryPicker();
                document.getElementById('folderBtn').style.display = 'none';
                document.getElementById('startBtn').style.display = 'inline-block';
            } catch (error) {}
        }

        async function saveTextToFile(filename, content) {
            if (!folderHandle) return;
            try {
                const fileHandle = await folderHandle.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();
            } catch (error) {}
        }

        // 💡 극단적이고 짧은 절단 로직 적용
        function findCutMatch(text) {
            // 1순위: 종결어미가 나오면 즉시 절단 (단, 뒤에 띄어쓰기가 있을 때만 인정하여 단어 파괴 방지)
            let regexEnd = /(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|하옵소서|나이다|옵소서|이옵니다|습니까|합니까|인가요|은가요|는가요|네요|어요|아요|예요|대요|지요|군요|죠|겠습니다|겠지만|입니다|입니까)(\s)/g;
            let execResult = regexEnd.exec(text);
            
            if (execResult !== null && execResult.index >= 8) {
                return execResult;
            }
            
            // 2순위: 40자(화면 한 줄)가 넘어가는 순간 사정없이 즉시 절단!
            if (text.length > 40) {
                let lastSpace = text.lastIndexOf(" ", 40);
                if (lastSpace > 10) return { index: lastSpace, 0: " " };
                // 띄어쓰기조차 없이 40자가 넘어가면 40자 위치에서 강제 컷
                return { index: 40, 0: "" };
            }
            return null;
        }

        if (!('webkitSpeechRecognition' in window)) {
            alert("구글 크롬을 사용해 주십시오.");
        } else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onstart = function() {
                const rt = document.getElementById('realtimeText');
                rt.innerText = "🟢 마이크 준비 완료!";
                rt.style.color = "#4CAF50";
            };

            recognition.onresult = function(event) {
                lastSpeechTime = Date.now();
                let interimText = "";
                let finalForThisLoop = "";

                document.getElementById('realtimeText').style.color = "#ffeb3b";

                // 💡 이번 인식에서 확정된 글자들만 따로 추출 (메모리 찌꺼기 방지)
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalForThisLoop += event.results[i][0].transcript;
                    } else {
                        interimText += event.results[i][0].transcript;
                    }
                }

                unprocessedFinalText += finalForThisLoop;
                let liveText = (unprocessedFinalText + interimText).trim();
                
                if (liveText) {
                    document.getElementById('realtimeText').innerText = `듣는 중: ${liveText}`;
                    
                    if (Date.now() - lastLivePushTime > 250) {
                        lastLivePushTime = Date.now();
                        fetch(FIREBASE_URL, {
                            method: "PATCH",
                            body: JSON.stringify({
                                _timestamp: Date.now(),
                                ko: { text: liveText, id: currentSentenceId, isFinal: false }
                            })
                        }).catch(e => {});
                        saveTextToFile('temp_live.txt', liveText);
                    }
                }

                let match = findCutMatch(unprocessedFinalText);
                
                while (match) {
                    let cutIndex = match.index + match[0].length;
                    let sentenceToProcess = unprocessedFinalText.substring(0, cutIndex).trim();
                    
                    // 자른 텍스트는 메모리에서 그 즉시 영구 삭제하여 브라우저 부담 제로화
                    unprocessedFinalText = unprocessedFinalText.substring(cutIndex);
                    
                    let idToProcess = currentSentenceId;
                    currentSentenceId = Date.now();
                    
                    if (sentenceToProcess.length > 0) {
                        appendLogMessage(sentenceToProcess, idToProcess, false);
                        processOpenAITranslation(sentenceToProcess, idToProcess);
                    }
                    
                    match = findCutMatch(unprocessedFinalText);
                }
            };

            recognition.onend = function() {
                if (isBroadcasting) { setTimeout(() => { try { recognition.start(); } catch(e) {} }, 10); }
            };
        }

        function highlightDifferences(origText, corrText) {
            const origWords = origText.trim().split(/\s+/);
            const corrWords = corrText.trim().split(/\s+/);
            return corrWords.map((word, idx) => {
                if (idx >= origWords.length || origWords[idx] !== word) {
                    return `<span style="color: #ff5252; font-weight: bold;">${word}</span>`;
                }
                return word;
            }).join(" ");
        }

        function appendLogMessage(originalText, msgId, isFinished, korText = "") {
            const box = document.getElementById('logBox');
            let targetDiv = document.getElementById(`log_${msgId}`);
            
            if (!targetDiv) {
                targetDiv = document.createElement('div');
                targetDiv.id = `log_${msgId}`;
                targetDiv.style.marginBottom = "20px";
                targetDiv.style.paddingBottom = "15px";
                targetDiv.style.borderBottom = "1px solid #333";
                box.appendChild(targetDiv);
            }
            
            if (isFinished) {
                targetDiv.innerHTML = `
                    <div style="color: #aaa; font-size: 16px; margin-bottom: 5px;">🎤 원본: ${originalText}</div>
                    <div style="color: #00bcd4; font-size: 18px; font-weight: bold;">✨ 교정 및 번역 완료: ${korText}</div>
                `;
            } else {
                targetDiv.innerHTML = `
                    <div style="color: #aaa; font-size: 16px; margin-bottom: 5px;">🎤 원본: ${originalText}</div>
                    <div style="color: #555; font-size: 18px; font-weight: bold;">✨ AI 교정 및 다국어 통역 중...</div>
                `;
            }
            box.scrollTop = box.scrollHeight;
        }

        async function processOpenAITranslation(koreanText, msgId) {
            if (!OPENAI_API_KEY) {
                appendLogMessage(koreanText, msgId, true, "<span style='color:red;'>[오류] API 키를 입력해 주세요.</span>");
                return;
            }

            const prompt = `
너는 기독교 예배 설교를 전담하는 최고 수준의 동시통역사야.
다음 목사님의 설교 발화를 읽고:
1) 한국어 오탈자와 띄어쓰기를 문맥에 맞게 다듬어 교정해.
2) 나머지 7개 언어로 자연스럽고 영적인 울림이 있도록 번역해.
3) [원문 보존 철저] 원문에 있는 단어, 표현, 접속사(예: "또 하나" 등)를 절대 임의로 빼거나 삭제하지 말고 100% 모두 포함해.
4) 요약이나 중략을 절대 하지 마.

반드시 아래 JSON 형식으로만 응답해:
{
  "ko": "교정된 한국어",
  "en": "영어 번역",
  "zh-CN": "중국어 번역",
  "vi": "베트남어 번역",
  "id": "인도네시아어 번역",
  "ne": "네팔어 번역",
  "tl": "타갈로그어 번역",
  "ru": "러시아어 번역"
}

발화 원본: "${koreanText}"
`;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ role: "user", content: prompt }],
                        response_format: { type: "json_object" },
                        temperature: 0.1
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    appendLogMessage(koreanText, msgId, true, `<span style='color:red;'>[오류] ${data.error.message}</span>`);
                    return;
                }

                const result = JSON.parse(data.choices[0].message.content);

                let highlightedHtml = highlightDifferences(koreanText, result.ko);
                appendLogMessage(koreanText, msgId, true, highlightedHtml);

                let translationPayload = { _timestamp: Date.now() };
                
                if (result.ko) {
                    saveTextToFile('ko.txt', result.ko);
                    translationPayload.ko = { text: result.ko, id: msgId, isFinal: true };
                }
                
                ['en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'].forEach(lang => {
                    if (result[lang]) {
                        saveTextToFile(`${lang}.txt`, result[lang]);
                        translationPayload[lang] = { text: result[lang], id: msgId };
                    }
                });

                fetch(FIREBASE_URL, { method: "PATCH", body: JSON.stringify(translationPayload) }).catch(e => {});

            } catch (error) {}
        }

        function startBroadcast() {
            if (!OPENAI_API_KEY) {
                alert("API 키를 먼저 입력하고 저장해주세요!");
                return;
            }
            
            isBroadcasting = true; unprocessedFinalText = ""; currentSentenceId = Date.now();
            recognition.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';

            silenceTimer = setInterval(() => {
                if (isBroadcasting) {
                    let silenceDuration = Date.now() - lastSpeechTime;
                    
                    // 💡 침묵 대기 시간 단축: 1.5초만 말이 없어도 미처리 문장을 털어서 바로 보내버립니다.
                    if (silenceDuration > 1500 && unprocessedFinalText.trim().length > 0) {
                        let sentenceToProcess = unprocessedFinalText.trim();
                        unprocessedFinalText = "";
                        
                        let idToProcess = currentSentenceId;
                        currentSentenceId = Date.now();
                        
                        appendLogMessage(sentenceToProcess, idToProcess, false);
                        processOpenAITranslation(sentenceToProcess, idToProcess);
                    }
                }
            }, 500);
        }
        
        async function stopBroadcast() {
            isBroadcasting = false; clearInterval(silenceTimer);
            if(recognition) recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            fetch(FIREBASE_URL, { method: "PUT", body: JSON.stringify({ _timestamp: Date.now() }) });
        }
    </script>
</body>
</html>
