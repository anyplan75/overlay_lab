<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 송출기 (이중 바구니 무손실 & 70자 컷팅)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        h1 { color: #4CAF50; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; }
        #startBtn { background-color: #f44336; color: white; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 15px; border-radius: 8px; font-size: 22px; margin-top: 20px; min-height: 30px; font-weight: bold;}
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 300px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.6; font-size: 14px;}
        .ko-text { color: #4CAF50; }
        .ai-text { color: #00bcd4; font-weight: bold; margin-bottom: 10px;}
        .warning-text { color: #ff9800; font-weight: bold; margin-bottom: 10px;}
    </style>
</head>
<body>

    <h1>🎙️ 무손실 분리형 송출기</h1>
    <p>임시 글자와 확정 글자를 분리하여 단 1음절의 유실도 허용하지 않으며, 최대 70자 기준으로 안전하게 자릅니다.</p>
    
    <button id="startBtn" onclick="startBroadcast()">🔴 방송 시작</button>
    <button id="stopBtn" onclick="stopBroadcast()">⏹️ 방송 종료 및 요약 저장</button>

    <div id="realtimeText">대기 중...</div>
    <div id="logBox">AI 처리 및 번역 기록이 쌓입니다.</div>

    <script>
        const GEMINI_API_KEY = "형님의_API_키를_넣어주세요";
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;
        
        // 💡 핵심: 가위질을 위한 '100% 확정 전용' 안전 바구니
        let unprocessedFinalText = "";

        let currentSentenceId = Date.now();
        let fullSermonText = "";
        let lastSpeechTime = Date.now();
        let silenceTimer = null;

        if (!('webkitSpeechRecognition' in window)) alert("크롬 브라우저 전용입니다!");
        else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                lastSpeechTime = Date.now();
                let interimTranscript = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        // 확정 도장이 찍힌 글자만 안전 바구니로 넣습니다.
                        unprocessedFinalText += event.results[i][0].transcript;
                    } else {
                        // 아직 예상 중인 글자는 화면 표시용으로만 씁니다.
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // 1. 화면 송출: 안전 바구니 + 임시 글자를 모두 합쳐서 즉시 보여줍니다.
                let currentKoText = unprocessedFinalText + interimTranscript;
                if (currentKoText.trim()) {
                    document.getElementById('realtimeText').innerText = `듣는 중: ${currentKoText.trim()}`;
                    fetch(FIREBASE_URL, {
                        method: "PATCH",
                        body: JSON.stringify({ ko: { text: currentKoText.trim(), id: currentSentenceId }, _timestamp: Date.now() })
                    }).catch(e => {});
                }

                // 💡 2. 가위질: 오직 '안전 바구니(unprocessedFinalText)' 안에서만 어미를 찾습니다.
                let match = unprocessedFinalText.match(/(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|까요|을까요|잖아요|대요|지요|네요|어요|해요|입니다|나이다|니다|은데|는데|지만|거든요|은데요|는데요|고요|죠|서요|으리라|하리라|새요|셔요|십시다|읍시다|더라|이르되|하되|하니라|나니|도다|거늘|지라|으매|가라사대|하옵소서)($|[ \.\,\?\!]+)/);
                
                // 💡 3. 형님 요청: 어미가 없어도 70자가 넘어가면 안전한 위치(45자 이후 띄어쓰기)에서 자릅니다.
                if (!match && unprocessedFinalText.length > 70) {
                    let lastSpace = unprocessedFinalText.lastIndexOf(" ");
                    if (lastSpace > 45) {
                        match = { index: lastSpace, 0: " " };
                    } else {
                        match = { index: 70, 0: "" }; // 띄어쓰기가 아예 없으면 70자에서 칼같이 끊음
                    }
                }
                
                // 가위질을 시작합니다.
                while (match) {
                    let cutIndex = match.index + match[0].length;
                    let sentenceToProcess = unprocessedFinalText.substring(0, cutIndex).trim();
                    
                    // 안전 바구니에서 자른 만큼 비워냅니다.
                    unprocessedFinalText = unprocessedFinalText.substring(cutIndex);
                    
                    fullSermonText += sentenceToProcess + " ";
                    let idToProcess = currentSentenceId;
                    currentSentenceId = Date.now();
                    
                    if (sentenceToProcess.length > 0) {
                        processSentenceAsync(sentenceToProcess, idToProcess);
                    }
                    
                    // 바구니에 남은 글자가 있는지 계속 확인합니다.
                    match = unprocessedFinalText.match(/(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|까요|을까요|잖아요|대요|지요|네요|어요|해요|입니다|나이다|니다|은데|는데|지만|거든요|은데요|는데요|고요|죠|서요|으리라|하리라|새요|셔요|십시다|읍시다|더라|이르되|하되|하니라|나니|도다|거늘|지라|으매|가라사대|하옵소서)($|[ \.\,\?\!]+)/);
                    if (!match && unprocessedFinalText.length > 70) {
                        let lastSpace = unprocessedFinalText.lastIndexOf(" ");
                        if (lastSpace > 45) match = { index: lastSpace, 0: " " };
                        else match = { index: 70, 0: "" };
                    }
                }

                // 💡 4. 엔진 멱살 잡기: 만약 목사님 말씀이 너무 빨라서 엔진이 '임시 글자'만 70자 넘게 쥐고 안 놔주면?
                // 강제로 마이크를 한 번 껐다 켜서 그 임시 글자들을 '안전 바구니'로 쏟아버리게 만듭니다!
                if (interimTranscript.length > 70) {
                    try { recognition.stop(); } catch(e) {}
                }
            };

            recognition.onerror = function(event) { console.log("마이크 상태: " + event.error); };
            recognition.onend = function() { if (isBroadcasting) { setTimeout(() => { try { recognition.start(); } catch(e) {} }, 10); } };
        }

        async function processSentenceAsync(text, msgId) {
            logMessage(`🎤 원본: ${text}`);
            let correctedKoText = await correctKoreanWithGemini(text);
            
            const originalLength = text.replace(/\s/g, '').length;
            const correctedLength = correctedKoText.replace(/\s/g, '').length;
            
            if (correctedLength < originalLength * 0.8) {
                logMessage(`⚠️ 누락 감지 (원본 사용): AI가 문장을 축약하여 원본으로 대체합니다.`, true, true);
                correctedKoText = text;
            } else {
                logMessage(`✨ 교정본: ${correctedKoText}`, true);
            }
            
            const targetLangs = ['en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'];
            let translationPayload = { _timestamp: Date.now() };

            await Promise.all(targetLangs.map(async (lang) => {
                let trans = await fetchTranslation(correctedKoText, lang);
                translationPayload[lang] = { text: trans, id: msgId };
            }));

            translationPayload['ko'] = { text: correctedKoText, id: msgId };
            fetch(FIREBASE_URL, { method: "PATCH", body: JSON.stringify(translationPayload) });
        }

        async function correctKoreanWithGemini(text) {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const prompt = `당신은 전문 설교 녹취 교정자입니다. 아래 음성인식(STT) 텍스트를 읽고 문맥을 파악하여 오탈자와 띄어쓰기를 완벽하게 교정하세요.
[엄격한 규칙]
1. 화자가 말한 모든 내용은 단 한 문장, 한 단어도 빼먹거나 요약하지 말고 100% 모두 출력할 것.
2. 문맥에 맞지 않는 엉뚱한 오인식 단어만 올바르게 수정할 것.
3. 부연 설명 없이 교정된 텍스트만 출력할 것.

[원본]: ${text}`;
                const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) return result.candidates[0].content.parts[0].text.trim();
            } catch (error) {}
            return text;
        }

        async function fetchTranslation(text, targetLang) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                return data[0].map(item => item[0]).join("");
            } catch (error) { return text; }
        }

        function startBroadcast() {
            isBroadcasting = true; fullSermonText = ""; unprocessedFinalText = ""; currentSentenceId = Date.now();
            recognition.start(); document.getElementById('startBtn').style.display = 'none'; document.getElementById('stopBtn').style.display = 'inline-block';
            logMessage("🎙️ 이중 바구니 무손실 방송 시작!");

            silenceTimer = setInterval(() => {
                if (isBroadcasting) {
                    let silenceDuration = Date.now() - lastSpeechTime;
                    
                    // 2.5초 이상 침묵이 흐르면 남은 글자를 싹 다 털어냅니다.
                    if (silenceDuration > 2500) {
                        try { recognition.stop(); } catch(e) {} // 멈춰서 남은 글자를 확정 짓기
                        if (unprocessedFinalText.trim().length > 0) {
                            let sentenceToProcess = unprocessedFinalText.trim();
                            unprocessedFinalText = "";
                            fullSermonText += sentenceToProcess + " ";
                            let idToProcess = currentSentenceId;
                            currentSentenceId = Date.now();
                            processSentenceAsync(sentenceToProcess, idToProcess);
                        }
                    }
                }
            }, 500);
        }
        
        async function stopBroadcast() {
            isBroadcasting = false; clearInterval(silenceTimer); recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block'; document.getElementById('stopBtn').style.display = 'none';
            logMessage("⏹️ 방송 종료. 요약을 시작합니다...");
            fetch(FIREBASE_URL, { method: "PUT", body: JSON.stringify({ _timestamp: Date.now() }) });
            await generateSummaryFile();
        }

        async function generateSummaryFile() {
            if (!fullSermonText.trim()) return;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const prompt = `아래 예배 설교를 서론-본론-결론 소제목을 달아 완벽한 요약 문서로 만들어줘.\n\n[설교 원본]\n${fullSermonText}`;
            try {
                const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const result = await response.json();
                let finalSummary = result.candidates ? result.candidates[0].content.parts[0].text : `[오류]\n${fullSermonText}`;
                const blob = new Blob([finalSummary], { type: 'text/plain' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
                const now = new Date(); link.download = `설교요약_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}_${now.getHours()}-${now.getMinutes()}.txt`; link.click();
            } catch (error) { logMessage(`❌ 요약 오류: ${error}`); }
        }

        function logMessage(msg, isAi = false, isWarning = false) {
            const box = document.getElementById('logBox');
            let className = isAi ? 'ai-text' : 'ko-text';
            if (isWarning) className = 'warning-text';
            box.innerHTML += `<div class="${className}">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
