<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 송출기 (정상 작동 & 빨간색 교정)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        h1 { color: #4CAF50; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; }
        #startBtn { background-color: #f44336; color: white; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 15px; border-radius: 8px; font-size: 22px; margin-top: 20px; min-height: 30px; font-weight: bold;}
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 350px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.6; font-size: 14px;}
        .ko-text { color: #4CAF50; }
        .ai-text { color: #00bcd4; font-weight: bold; margin-bottom: 10px;}
        /* 💡 교정된 글자를 빨간색으로 표시하는 스타일 */
        .highlight-fixed { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ 실시간 받아쓰기 & 빨간색 교정 송출기</h1>
    <p>멈춤 없이 부드럽게 받아쓰며, 교정된 단어는 빨간색으로 강조됩니다.</p>
    
    <button id="startBtn" onclick="startBroadcast()">🔴 방송 시작</button>
    <button id="stopBtn" onclick="stopBroadcast()">⏹️ 방송 종료</button>

    <div id="realtimeText">대기 중...</div>
    <div id="logBox">실시간 처리 기록이 쌓입니다.</div>

    <script>
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;
        let unprocessedFinalText = "";
        let currentSentenceId = Date.now();
        let lastSpeechTime = Date.now();
        let silenceTimer = null;

        if (!('webkitSpeechRecognition' in window)) alert("구글 크롬 브라우저 전용입니다!");
        else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                lastSpeechTime = Date.now();
                let interimTranscript = "";
                let newlyFinalized = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        newlyFinalized += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                unprocessedFinalText += newlyFinalized;

                // 실시간 화면 표시 (막힘없이 바로 뜸)
                let currentKoText = unprocessedFinalText + interimTranscript;
                if (currentKoText.trim()) {
                    document.getElementById('realtimeText').innerText = `듣는 중: ${currentKoText.trim()}`;
                    fetch(FIREBASE_URL, {
                        method: "PATCH",
                        body: JSON.stringify({ ko: { text: currentKoText.trim(), id: currentSentenceId }, _timestamp: Date.now() })
                    }).catch(e => {});
                }

                // 어미 감지 정규식 (가장 안정적인 버전)
                let match = unprocessedFinalText.match(/(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|까요|을까요|잖아요|대요|지요|네요|어요|해요|입니다|나이다|니다|은데|는데|지만|거든요|은데요|는데요|고요|죠|서요|으리라|하리라|새요|셔요|십시다|읍시다|더라|이르되|하되|하니라|나니|도다|거늘|지라|으매|가라사대|하옵소서)($|[ \.\,\?\!]+)/);
                
                if (!match && unprocessedFinalText.length > 70) {
                    let lastSpace = unprocessedFinalText.lastIndexOf(" ");
                    if (lastSpace > 40) match = { index: lastSpace, 0: " " };
                    else match = { index: 70, 0: "" };
                }
                
                while (match) {
                    let cutIndex = match.index + match[0].length;
                    let sentenceToProcess = unprocessedFinalText.substring(0, cutIndex).trim();
                    unprocessedFinalText = unprocessedFinalText.substring(cutIndex);
                    
                    let idToProcess = currentSentenceId;
                    currentSentenceId = Date.now();
                    
                    if (sentenceToProcess.length > 0) {
                        processAndSend(sentenceToProcess, idToProcess);
                    }
                    
                    match = unprocessedFinalText.match(/(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|까요|을까요|잖아요|대요|지요|네요|어요|해요|입니다|나이다|니다|은데|는데|지만|거든요|은데요|는데요|고요|죠|서요|으리라|하리라|새요|셔요|십시다|읍시다|더라|이르되|하되|하니라|나니|도다|거늘|지라|으매|가라사대|하옵소서)($|[ \.\,\?\!]+)/);
                    if (!match && unprocessedFinalText.length > 70) {
                        let lastSpace = unprocessedFinalText.lastIndexOf(" ");
                        if (lastSpace > 40) match = { index: lastSpace, 0: " " };
                        else match = { index: 70, 0: "" };
                    }
                }
            };

            recognition.onerror = function(event) { console.log("마이크 상태: " + event.error); };
            recognition.onend = function() {
                if (isBroadcasting) {
                    setTimeout(() => { try { recognition.start(); } catch(e) {} }, 10);
                }
            };
        }

        // 💡 문장 처리 및 빨간색 하이라이트 적용 함수
        async function processAndSend(text, msgId) {
            logMessage(`🎤 원본: ${text}`);
            
            // 오탈자 교정 시뮬레이션 및 빨간색 태그 적용
            let corrected = text
                .replace(/하나님 의/g, '하나님<span class="highlight-fixed">의</span>')
                .replace(/예수 그리스도/g, '예수 그리스도<span class="highlight-fixed">의</span>')
                .replace(/성령 님/g, '성령<span class="highlight-fixed">님</span>');

            logMessage(`✨ 교정본: ${corrected}`, true);
            
            const targetLangs = ['en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'];
            let translationPayload = { _timestamp: Date.now() };

            await Promise.all(targetLangs.map(async (lang) => {
                let trans = await fetchTranslation(text, lang); // 번역은 깔끔하게 원문 기준으로 처리
                translationPayload[lang] = { text: trans, id: msgId };
            }));

            // 파이어베이스에는 태그를 제외한 순수 텍스트 전송
            let cleanCorrected = corrected.replace(/<[^>]*>/g, '');
            translationPayload['ko'] = { text: cleanCorrected, id: msgId };
            fetch(FIREBASE_URL, { method: "PATCH", body: JSON.stringify(translationPayload) }).catch(e => {});
        }

        async function fetchTranslation(text, targetLang) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                return data[0].map(item => item[0]).join("");
            } catch (error) { return text; }
        }

        function startBroadcast() {
            isBroadcasting = true; unprocessedFinalText = ""; currentSentenceId = Date.now();
            recognition.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            logMessage("🎙️ 방송 송출이 시작되었습니다.");

            silenceTimer = setInterval(() => {
                if (isBroadcasting) {
                    let silenceDuration = Date.now() - lastSpeechTime;
                    if (silenceDuration > 2500 && unprocessedFinalText.trim().length > 0) {
                        let sentenceToProcess = unprocessedFinalText.trim();
                        unprocessedFinalText = "";
                        let idToProcess = currentSentenceId;
                        currentSentenceId = Date.now();
                        processAndSend(sentenceToProcess, idToProcess);
                    }
                }
            }, 500);
        }
        
        function stopBroadcast() {
            isBroadcasting = false; clearInterval(silenceTimer);
            if(recognition) recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            logMessage("⏹️ 방송이 종료되었습니다.");
        }

        function logMessage(msg, isAi = false) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div style="margin-bottom: 8px;" class="${isAi ? 'ai-text' : 'ko-text'}">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
