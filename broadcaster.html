<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 송출기 (글자 수 체크 & 대기열 시스템)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 500px; overflow-y: auto; text-align: left; font-size: 13px;}
        .ko-text { color: #4CAF50; }
        .ai-text { color: #00bcd4; }
        .debug-text { color: #ff9800; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🎙️ 데이터 큐(Queue) 무손실 송출기</h1>
    <div id="logBox">데이터 대기열 시스템 가동 중...</div>

    <script>
        const GEMINI_API_KEY = "AIzaSyAHkYcv8tZ-NaRH2NBmLdVGQ-PjOOqwsiM";
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;
        
        // 💡 핵심: 글자를 덮어쓰지 않고 줄을 세우는 대기열(Queue)
        let bufferQueue = [];
        let currentSentenceId = Date.now();

        if (!('webkitSpeechRecognition' in window)) alert("크롬 전용입니다!");
        else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        let finalText = event.results[i][0].transcript;
                        // 💡 확정된 글자를 큐에 넣고 바로 가위질 시작
                        bufferQueue.push(finalText);
                        processQueue();
                    }
                }
            };
            recognition.onend = function() { if (isBroadcasting) { setTimeout(() => { try { recognition.start(); } catch(e) {} }, 10); } };
        }

        // 💡 큐에 쌓인 글자를 하나씩 순서대로 꺼내 처리
        async function processQueue() {
            if (bufferQueue.length === 0) return;
            let text = bufferQueue.shift(); // 큐에서 맨 앞 글자를 안전하게 꺼냄
            
            logMessage(`[카운팅] 원본 글자 수: ${text.length}자`, "debug-text");
            
            let corrected = await correctKoreanWithGemini(text);
            
            // 글자 수 검증
            if (corrected.length < text.length * 0.7) {
                logMessage(`⚠️ 누락 감지! (AI가 너무 많이 줄임 -> 원본 사용)`, "warning-text");
                corrected = text;
            }
            
            // Firebase 전송 로직... (이하 동일)
            processAndSend(corrected, currentSentenceId);
            currentSentenceId = Date.now();
        }

        async function correctKoreanWithGemini(text) {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const prompt = `원본 텍스트를 오탈자만 교정하고 길이는 최대한 유지해: ${text}`;
                const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const result = await response.json();
                return result.candidates ? result.candidates[0].content.parts[0].text.trim() : text;
            } catch (e) { return text; }
        }

        function logMessage(msg, className) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div class="${className}">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
        
        function startBroadcast() { isBroadcasting = true; recognition.start(); }
    </script>
</body>
</html>
