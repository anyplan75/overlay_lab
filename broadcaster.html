<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 송출기 (실시간 즉시 받아쓰기 & 자체 교정)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 20px; border-radius: 8px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 400px; overflow-y: auto; text-align: left; line-height: 1.6; }
        button { padding: 20px 40px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🎙️ 실시간 즉시 받아쓰기 & 자체 교정</h1>
    <div id="realtimeText">대기 중...</div>
    <button onclick="startBroadcast()">🔴 방송 시작</button>

    <div id="logBox">데이터 흐름 대기 중...</div>

    <script>
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        let recognition;
        
        // 💡 실시간 받아쓰기 로직 복구
        function startBroadcast() {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; // 💡 임시 결과 즉시 표출!
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                let fullText = "";
                for (let i = 0; i < event.results.length; ++i) {
                    fullText += event.results[i][0].transcript;
                }
                // 실시간으로 화면에 무조건 다 띄웁니다.
                document.getElementById('realtimeText').innerText = `듣는 중: ${fullText}`;
                
                // 가위질은 별도로 뒤에서 수행합니다.
                processAsIWait(fullText);
            };
            recognition.start();
        }

        // 문장이 완성되면 자체 교정을 거쳐 전송
        function processAsIWait(text) {
            let match = text.match(/(습니다|합니다|하십니다|바랍니다|아멘|까요|지요|네요|어요|해요|입니다|니다|은데|는데|지만|거든요|더라|이르되|하되|하니라|나니|도다|거늘|지라|가라사대)[ \.\,\?\!]+/);
            if (match) {
                let sentence = text.split(match[0])[0] + match[0];
                let corrected = sentence.replace(/하나님 의/g, "하나님의");
                
                document.getElementById('logBox').innerHTML += `<div>🎤 원본: ${sentence}</div><div>✨ 교정: ${corrected}</div>`;
                // 번역 및 전송...
            }
        }
    </script>
</body>
</html>
