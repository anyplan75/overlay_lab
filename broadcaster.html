<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 송출기 (폭포수 버그 해결 및 깔끔한 문장 단위 전송)</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 40px; text-align: center; }
        h1 { color: #4CAF50; }
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; }
        #startBtn { background-color: #f44336; color: white; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 15px; border-radius: 8px; font-size: 22px; margin-top: 20px; min-height: 30px; font-weight: bold;}
        #logBox { background: #000; padding: 20px; border-radius: 8px; height: 350px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.6; font-size: 14px;}
        .ko-text { color: #4CAF50; }
        .ai-text { color: #00bcd4; font-weight: bold; margin-bottom: 10px;}
        .highlight-fixed { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ 문장 단위 깔끔한 송출기</h1>
    <p>실시간 듣기는 부드럽게 보여주고, 완성된 문장 단위로만 딱 한 번씩 전송 및 덮어쓰기 교정을 수행합니다.</p>
    
    <button id="startBtn" onclick="startBroadcast()">🔴 방송 시작</button>
    <button id="stopBtn" onclick="stopBroadcast()">⏹️ 방송 종료</button>

    <div id="realtimeText">대기 중...</div>
    <div id="logBox">실시간 처리 기록이 쌓입니다.</div>

    <script>
        const GEMINI_API_KEY = "형님의_API_키를_넣어주세요";
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;
        
        let globalFinalText = "";
        let processedLength = 0;
        let unprocessedText = "";
        let lastSpeechTime = Date.now();
        let silenceTimer = null;

        if (!('webkitSpeechRecognition' in window)) alert("구글 크롬 브라우저 전용입니다!");
        else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                lastSpeechTime = Date.now();
                let currentInterim = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        globalFinalText += event.results[i][0].transcript + " ";
                    } else {
                        currentInterim += event.results[i][0].transcript;
                    }
                }

                let totalText = globalFinalText + currentInterim;
                unprocessedText = totalText.substring(processedLength);

                // 화면에는 실시간으로 듣는 중인 내용만 깨끗하게 표시
                if (unprocessedText.trim()) {
                    document.getElementById('realtimeText').innerText = `듣는 중: ${unprocessedText.trim()}`;
                }

                // 어미 감지 가위 공식 (문장이 끝났을 때만 작동)
                let match = unprocessedText.match(/(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|까요|을까요|잖아요|대요|지요|네요|어요|해요|입니다|나이다|니다|은데|는데|지만|거든요|은데요|는데요|고요|죠|서요|으리라|하리라|새요|셔요|십시다|읍시다|더라|이르되|하되|하니라|나니|도다|거늘|지라|으매|가라사대|하옵소서)($|[ \.\,\?\!]+)/);
                
                if (!match && unprocessedText.length > 70) {
                    let lastSpace = unprocessedText.lastIndexOf(" ");
                    if (lastSpace > 45) match = { index: lastSpace, 0: " " };
                    else match = { index: 70, 0: "" };
                }
                
                while (match) {
                    let cutIndex = match.index + match[0].length;
                    let sentenceToProcess = unprocessedText.substring(0, cutIndex).trim();
                    
                    processedLength += cutIndex;
                    unprocessedText = totalText.substring(processedLength);
                    
                    if (sentenceToProcess.length > 0) {
                        let uniqueId = "msg_" + Date.now() + "_" + Math.random().toString(36.substring(2, 7));
                        
                        // 1단계: 완성된 문장 원본을 먼저 송출
                        sendSentencePipeline(sentenceToProcess, uniqueId);
                    }
                    
                    match = unprocessedText.match(/(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|까요|을까요|잖아요|대요|지요|네요|어요|해요|입니다|나이다|니다|은데|는데|지만|거든요|은데요|는데요|고요|죠|서요|으리라|하리라|새요|셔요|십시다|읍시다|더라|이르되|하되|하니라|나니|도다|거늘|지라|으매|가라사대|하옵소서)($|[ \.\,\?\!]+)/);
                    if (!match && unprocessedText.length > 70) {
                        let lastSpace = unprocessedText.lastIndexOf(" ");
                        if (lastSpace > 45) match = { index: lastSpace, 0: " " };
                        else match = { index: 70, 0: "" };
                    }
                }
            };

            recognition.onerror = function(event) { console.log("마이크 상태: " + event.error); };
            recognition.onend = function() {
                if (isBroadcasting) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        // 💡 문장 단위 파이프라인 (원본 1회 송출 -> 백그라운드 교정 후 덮어쓰기 1회)
        async function sendSentencePipeline(rawText, msgId) {
            logMessage(`🎤 원본 송출: ${rawText}`);
            
            // 먼저 원본을 파이어베이스에 쏜다
            await sendToFirebase(rawText, msgId);

            // 백그라운드에서 교정 시작
            let corrected = await correctKoreanWithGemini(rawText);
            if (!corrected || corrected === rawText) {
                corrected = rawText
                    .replace(/하나님 의/g, '하나님<span class="highlight-fixed">의</span>')
                    .replace(/예수 그리스도/g, '예수 그리스도<span class="highlight-fixed">의</span>')
                    .replace(/성령 님/g, '성령<span class="highlight-fixed">님</span>');
            } else {
                corrected = corrected
                    .replace(/하나님의/g, '하나님<span class="highlight-fixed">의</span>')
                    .replace(/성령님/g, '성령<span class="highlight-fixed">님</span>');
            }

            logMessage(`✨ 교정 덮어쓰기: ${corrected}`, true);

            // 교정본으로 동일한 ID를 덮어씀
            let cleanCorrected = corrected.replace(/<[^>]*>/g, '');
            await sendToFirebase(cleanCorrected, msgId);
        }

        async function correctKoreanWithGemini(text) {
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const prompt = `다음 텍스트의 오탈자만 교정해. 결과만 출력:\n${text}`;
                const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) return result.candidates[0].content.parts[0].text.trim();
            } catch (error) {}
            return text;
        }

        async function sendToFirebase(text, msgId) {
            const targetLangs = ['en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'];
            let translationPayload = { _timestamp: Date.now() };

            await Promise.all(targetLangs.map(async (lang) => {
                let trans = await fetchTranslation(text, lang);
                translationPayload[lang] = { text: trans, id: msgId };
            }));

            translationPayload['ko'] = { text: text, id: msgId };
            fetch(FIREBASE_URL, { method: "PATCH", body: JSON.stringify(translationPayload) }).catch(e => {});
        }

        async function fetchTranslation(text, targetLang) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                return data[0].map(item => item[0]).join("");
            } catch (error) { return text; }
        }

        function startBroadcast() {
            isBroadcasting = true; globalFinalText = ""; processedLength = 0; unprocessedText = "";
            recognition.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            logMessage("🎙️ 문장 단위 송출기 가동 시작!");

            // 침묵 타이머 (말이 끝났는데 어미 감지가 안 되었을 때 안전하게 털어주는 역할)
            silenceTimer = setInterval(() => {
                if (isBroadcasting) {
                    let silenceDuration = Date.now() - lastSpeechTime;
                    if (silenceDuration > 3000 && unprocessedText.trim().length > 0) {
                        let sentenceToProcess = unprocessedText.trim();
                        processedLength += unprocessedText.length;
                        unprocessedText = "";
                        let uniqueId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
                        sendSentencePipeline(sentenceToProcess, uniqueId);
                    }
                }
            }, 1000);
        }
        
        function stopBroadcast() {
            isBroadcasting = false; clearInterval(silenceTimer);
            if(recognition) recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            logMessage("⏹️ 방송이 종료되었습니다.");
        }

        function logMessage(msg, isAi = false) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div style="margin-bottom: 6px;" class="${isAi ? 'ai-text' : 'ko-text'}">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
