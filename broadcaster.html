<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예배 자막 송출기 (실시간 원문 + AI 덮어쓰기)</title>
    
    <!-- 💡 독립 데스크톱/모바일 앱 실행 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #1e1e1e; color: white; padding: 20px; margin: 0; user-select: none; }
        h1 { color: #4CAF50; text-align: center; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 10px; }
        #folderBtn { background-color: #FF9800; color: white; }
        #startBtn { background-color: #f44336; color: white; display: none; }
        #stopBtn { background-color: #2196F3; color: white; display: none; }
        #realtimeText { background: #333; color: #ffeb3b; padding: 15px; border-radius: 8px; font-size: 22px; margin-top: 20px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h1>🎙️ 실시간 다중 송출 및 파일 저장 시스템</h1>
    <p style="text-align: center; color:#aaa;">1단계: 아이클라우드 폴더 연결 <br>2단계: 방송 시작</p>
    
    <div style="text-align: center;">
        <button id="folderBtn" class="btn" onclick="connectLocalFolder()">📁 저장 폴더 연결하기</button>
        <button id="startBtn" class="btn" onclick="startBroadcast()">🔴 방송 시작</button>
        <button id="stopBtn" class="btn" onclick="stopBroadcast()">⏹️ 방송 종료</button>
    </div>

    <div id="realtimeText">대기 중...</div>
    
    <div id="logBox" style="background: #111; padding: 20px; border-radius: 8px; height: 500px; overflow-y: auto; margin-top: 20px; text-align: left; line-height: 1.8;"></div>

    <script>
        // 💡 발급받으신 OpenAI API 키를 여기에 넣으세요
        const OPENAI_API_KEY = "";
        
        const FIREBASE_URL = "https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/subtitles.json";
        
        let recognition;
        let isBroadcasting = false;
        let folderHandle = null;
        
        let globalFinalText = "";
        let processedLength = 0;
        let unprocessedText = "";
        let currentSentenceId = Date.now();
        let fullSermonText = "";
        let lastSpeechTime = Date.now();
        let silenceTimer = null;

        async function connectLocalFolder() {
            try {
                folderHandle = await window.showDirectoryPicker();
                document.getElementById('folderBtn').style.display = 'none';
                document.getElementById('startBtn').style.display = 'inline-block';
            } catch (error) {}
        }

        async function saveTextToFile(filename, content) {
            if (!folderHandle) return;
            try {
                const fileHandle = await folderHandle.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();
            } catch (error) {}
        }

        if (!('webkitSpeechRecognition' in window)) {
            alert("구글 크롬을 사용해 주십시오.");
        } else {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = function(event) {
                lastSpeechTime = Date.now();
                let currentInterim = "";

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        globalFinalText += event.results[i][0].transcript;
                    } else {
                        currentInterim += event.results[i][0].transcript;
                    }
                }

                let totalText = globalFinalText + currentInterim;
                unprocessedText = totalText.substring(processedLength);

                let liveText = unprocessedText.trim();
                if (liveText) {
                    document.getElementById('realtimeText').innerText = `듣는 중: ${liveText}`;
                    
                    // 💡 [변경 1] 한국어는 듣는 즉시 화면에 띄우도록 실시간 송출 (추후 교정본으로 덮어씌워짐)
                    fetch(FIREBASE_URL, {
                        method: "PATCH",
                        body: JSON.stringify({
                            _timestamp: Date.now(),
                            ko: { text: liveText + "...", id: currentSentenceId }
                        })
                    }).catch(e => {});
                    
                    saveTextToFile('temp_live.txt', liveText);
                }

                let regex = /(습니다|합니다|하십니다|바랍니다|축원합니다|할지어다|아멘|하옵소서|[요다까나])(\s|[.,?!]|$)/g;
                let match = null;
                let execResult;
                
                while ((execResult = regex.exec(unprocessedText)) !== null) {
                    if (execResult.index >= 15) { match = execResult; break; }
                }

                if (!match && unprocessedText.length > 80) {
                    let lastSpace = unprocessedText.lastIndexOf(" ", 80);
                    if (lastSpace > 20) match = { index: lastSpace, 0: " " };
                    else match = { index: 80, 0: "" };
                }
                
                while (match) {
                    let cutIndex = match.index + match[0].length;
                    let sentenceToProcess = unprocessedText.substring(0, cutIndex).trim();
                    
                    processedLength += cutIndex;
                    unprocessedText = totalText.substring(processedLength);
                    fullSermonText += sentenceToProcess + " ";
                    
                    let idToProcess = currentSentenceId;
                    // 💡 한 문장이 끝났으므로 다음 문장을 위해 새 ID 발급
                    currentSentenceId = Date.now();
                    
                    if (sentenceToProcess.length > 0) {
                        appendLogMessage(sentenceToProcess, idToProcess, false);
                        processOpenAITranslation(sentenceToProcess, idToProcess);
                    }
                    
                    match = null;
                    regex.lastIndex = 0;
                    
                    while ((execResult = regex.exec(unprocessedText)) !== null) {
                        if (execResult.index >= 15) { match = execResult; break; }
                    }
                    
                    if (!match && unprocessedText.length > 80) {
                        let lastSpace = unprocessedText.lastIndexOf(" ", 80);
                        if (lastSpace > 20) match = { index: lastSpace, 0: " " };
                        else match = { index: 80, 0: "" };
                    }
                }
            };

            recognition.onend = function() {
                if (isBroadcasting) { setTimeout(() => { try { recognition.start(); } catch(e) {} }, 10); }
            };
        }

        function highlightDifferences(origText, corrText) {
            const origWords = origText.trim().split(/\s+/);
            const corrWords = corrText.trim().split(/\s+/);
            return corrWords.map((word, idx) => {
                if (idx >= origWords.length || origWords[idx] !== word) {
                    return `<span style="color: #ff5252; font-weight: bold;">${word}</span>`;
                }
                return word;
            }).join(" ");
        }

        function appendLogMessage(originalText, msgId, isFinished, korText = "") {
            const box = document.getElementById('logBox');
            let targetDiv = document.getElementById(`log_${msgId}`);
            
            if (!targetDiv) {
                targetDiv = document.createElement('div');
                targetDiv.id = `log_${msgId}`;
                targetDiv.style.marginBottom = "20px";
                targetDiv.style.paddingBottom = "15px";
                targetDiv.style.borderBottom = "1px solid #333";
                box.appendChild(targetDiv);
            }
            
            if (isFinished) {
                targetDiv.innerHTML = `
                    <div style="color: #aaa; font-size: 16px; margin-bottom: 5px;">🎤 원본: ${originalText}</div>
                    <div style="color: #00bcd4; font-size: 18px; font-weight: bold;">✨ 교정 및 번역 완료: ${korText}</div>
                `;
            } else {
                targetDiv.innerHTML = `
                    <div style="color: #aaa; font-size: 16px; margin-bottom: 5px;">🎤 원본: ${originalText}</div>
                    <div style="color: #555; font-size: 18px; font-weight: bold;">✨ AI 교정 및 다국어 통역 중...</div>
                `;
            }
            box.scrollTop = box.scrollHeight;
        }

        // 💡 [변경 2] 기독교 설교에 맞는 엄격한 프롬프트 적용
        async function processOpenAITranslation(koreanText, msgId) {
            const prompt = `
너는 기독교 예배 설교를 전담하는 최고 수준의 동시통역사야.
다음 목사님의 설교 발화를 읽고:
1) 한국어 오탈자와 띄어쓰기를 문맥에 맞게 다듬어 교정해. 이때 설교에 어울리는 은혜로운 어휘와 존댓말, 신학적 뉘앙스를 철저히 살려야 해.
2) 나머지 7개 언어로 자연스럽고 영적인 울림이 있도록 번역해. 기독교 전문 용어(예: 보혈, 성령, 구원 등)를 정확한 각국 기독교 용어로 매칭해.

반드시 아래 JSON 형식으로만 응답해:
{
  "ko": "교정된 한국어",
  "en": "영어 번역",
  "zh-CN": "중국어 번역",
  "vi": "베트남어 번역",
  "id": "인도네시아어 번역",
  "ne": "네팔어 번역",
  "tl": "타갈로그어 번역",
  "ru": "러시아어 번역"
}

발화 원본: "${koreanText}"
`;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ role: "user", content: prompt }],
                        response_format: { type: "json_object" },
                        temperature: 0.2 // 지나친 창작을 막기 위해 온도를 낮춤
                    })
                });

                const data = await response.json();
                const result = JSON.parse(data.choices[0].message.content);

                let highlightedHtml = highlightDifferences(koreanText, result.ko);
                appendLogMessage(koreanText, msgId, true, highlightedHtml);

                let translationPayload = { _timestamp: Date.now() };
                ['ko', 'en', 'zh-CN', 'vi', 'id', 'ne', 'tl', 'ru'].forEach(lang => {
                    if (result[lang]) {
                        saveTextToFile(`${lang}.txt`, result[lang]);
                        // 💡 이미 송출된 기존 msgId에 교정본과 번역본을 덮어씌웁니다.
                        translationPayload[lang] = { text: result[lang], id: msgId };
                    }
                });

                fetch(FIREBASE_URL, { method: "PATCH", body: JSON.stringify(translationPayload) }).catch(e => {});

            } catch (error) {
                console.error("OpenAI 통역 오류:", error);
            }
        }

        function startBroadcast() {
            isBroadcasting = true; fullSermonText = ""; globalFinalText = ""; processedLength = 0; unprocessedText = ""; currentSentenceId = Date.now();
            recognition.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';

            silenceTimer = setInterval(() => {
                if (isBroadcasting) {
                    let silenceDuration = Date.now() - lastSpeechTime;
                    if (silenceDuration > 4500 && unprocessedText.trim().length > 0) {
                        let sentenceToProcess = unprocessedText.trim();
                        processedLength += unprocessedText.length;
                        unprocessedText = "";
                        fullSermonText += sentenceToProcess + " ";
                        
                        let idToProcess = currentSentenceId;
                        currentSentenceId = Date.now();
                        
                        appendLogMessage(sentenceToProcess, idToProcess, false);
                        processOpenAITranslation(sentenceToProcess, idToProcess);
                    }
                }
            }, 1000);
        }
        
        async function stopBroadcast() {
            isBroadcasting = false; clearInterval(silenceTimer);
            if(recognition) recognition.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            fetch(FIREBASE_URL, { method: "PUT", body: JSON.stringify({ _timestamp: Date.now() }) });
        }
    </script>
</body>
</html>
