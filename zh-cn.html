<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>中文字幕</title>
    <style>
        body { margin: 0; height: 100vh; overflow: hidden; background-color: transparent; font-family: sans-serif; }
        
        #container {
            position: absolute;
            transition: all 0.3s ease;
            /* 핵심: 상자 크기가 변해도 위치가 흔들리지 않게 함 */
            display: flex;
            flex-direction: column;
        }

        /* 1. 하단 중앙 모드: 아래쪽 정렬 */
        .layout-bottom {
            bottom: 50px; left: 50%; transform: translateX(-50%);
            width: 80vw;
            align-items: center; /* 가로 중앙 */
            justify-content: flex-end; /* 세로 아래쪽 */
        }

        /* 2. 왼쪽 2/5 모드: 아래쪽 정렬 */
        .layout-left {
            bottom: 50px; left: 50px; transform: none;
            width: 40vw; max-height: 90vh;
            align-items: flex-start; /* 가로 왼쪽 */
            justify-content: flex-end; /* 세로 아래쪽 */
        }

        #subtitle {
            padding: 20px 30px; border-radius: 15px; font-weight: bold; line-height: 1.6;
            text-align: center; /* 글자도 중앙으로 */
        }
    </style>
</head>
<body>
    <div id="container" class="layout-bottom">
        <div id="subtitle">等待中文字幕...</div>
    </div>
    <script>
        const currentLang = 'zh-cn';
        let lastTime = 0; let subtitleLines = []; let maxLines = 2;
        function updateSubtitle() {
            fetch("https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/.json").then(res => res.json()).then(data => {
                const container = document.getElementById('container');
                const subDiv = document.getElementById('subtitle');
                if(data && data.style && data.style.layout) {
                    if(data.style.layout === 'left') { container.className = 'layout-left'; maxLines = 10; }
                    else { container.className = 'layout-bottom'; maxLines = 2; }
                }
                if(data && data.subtitles && data.subtitles._timestamp !== lastTime) {
                    lastTime = data.subtitles._timestamp; let newText = data.subtitles[currentLang];
                    if (newText) {
                        subtitleLines.push(newText);
                        while (subtitleLines.length > maxLines) subtitleLines.shift();
                        subDiv.innerHTML = subtitleLines.join('<br><br>');
                    }
                }
                if(data && data.style) {
                    subDiv.style.fontSize = data.style.fontSize; subDiv.style.color = data.style.color;
                    let hex = data.style.bgColor.replace('#', '');
                    let r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
                    subDiv.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${data.style.bgOpacity})`;
                }
            });
        }
        setInterval(updateSubtitle, 300);
    </script>
</body>
</html>
