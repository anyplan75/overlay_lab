<!DOCTYPE html>
<html lang="zh-cn"><head><meta charset="UTF-8"><title>中文字幕</title><link rel="stylesheet" href="style.css"></head>
<body><div id="container" class="layout-bottom"><div id="subtitle">等待中文字幕...</div></div>
<script>const currentLang='zh-cn';let lastTime=0,subtitleLines=[],maxLines=2;function updateSubtitle(){fetch("https://overlay-lab-default-rtdb.asia-southeast1.firebasedatabase.app/.json").then(r=>r.json()).then(d=>{const c=document.getElementById('container'),s=document.getElementById('subtitle');if(d&&d.style&&d.style.layout){c.className=d.style.layout==='left'?'layout-left':'layout-bottom';maxLines=d.style.layout==='left'?10:2;}if(d&&d.subtitles&&d.subtitles._timestamp!==lastTime){lastTime=d.subtitles._timestamp;let n=d.subtitles[currentLang];if(n){subtitleLines.push(n);while(subtitleLines.length>maxLines)subtitleLines.shift();s.innerHTML=subtitleLines.join('<br>');}}if(d&&d.style){s.style.fontSize=d.style.fontSize;s.style.color=d.style.color;let h=d.style.bgColor.replace('#',''),r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);s.style.backgroundColor=`rgba(${r},${g},${b},${d.style.bgOpacity})`;}});}setInterval(updateSubtitle,300);</script></body></html>
